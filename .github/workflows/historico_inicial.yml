
name: Actualizar historico ajustado 6+1

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * 6"

permissions:
  contents: write

concurrency:
  group: observatorio-6plus1
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar yfinance
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.50,<2" "pandas<3"

      - name: Validar y actualizar historico ajustado
        run: |
          set -euo pipefail
          python historico_inicial.py

      - name: Conservar historico en GitHub
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/historico_validado_6plus1
          cp historico_inicial/market_*_adjusted.csv /tmp/historico_validado_6plus1/

          git fetch origin main
          git reset --hard origin/main

          mkdir -p historico_inicial
          cp /tmp/historico_validado_6plus1/market_*_adjusted.csv historico_inicial/

          git add historico_inicial/

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar historico ajustado validado 6+1"
            git push origin HEAD:main
          else
            echo "Historico sin cambios"
          fi

      - name: Guardar copia descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historico-ajustado-6plus1
          path: historico_inicial/
          if-no-files-found: warn
          retention-days: 30
