
name: Observatorio 6+1

on:
  workflow_dispatch:
  schedule:
    - cron: "37 23 * * 1-5"

permissions:
  contents: write

jobs:
  recopilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar observatorio
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python collector.py
          python radar.py

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-6plus1
          path: |
            data/
            output/
            *.csv
            *.json
          if-no-files-found: warn
          retention-days: 30
          
      - name: Conservar historico
        if: success()
        run: |
          if [ ! -d data ]; then
            echo "No hay carpeta data para guardar"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/
          if git diff --cached --quiet; then
            echo "No hay cambios"
          else
            git commit -m "Actualizar historico financiero"
            git push
          fi
          
