
name: Observatorio 6+1

on:
  workflow_dispatch:
  schedule:
    - cron: "37 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: observatorio-6plus1
  cancel-in-progress: false

jobs:
  recopilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.50,<2" pandas

      - name: Ejecutar observatorio completo
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail
          python collector.py
          python guardar_historico.py
          python radar.py
          python registro_senales.py
          python radar_multiactivo.py
          python backtest_6plus1.py
          python validacion_6plus1.py

      - name: Conservar historicos y senales
        if: success()
        run: |
          test -d historico || { echo 'ERROR: falta historico/'; exit 1; }
          test -d historico_multiactivo || { echo 'ERROR: falta historico_multiactivo/'; exit 1; }
          test -d registro_senales || { echo 'ERROR: falta registro_senales/'; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add historico/ historico_multiactivo/ registro_senales/

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar historicos y senales 6+1"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Guardar resultados descargables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-6plus1
          path: |
            output/
            historico/
            historico_multiactivo/
            registro_senales/
          if-no-files-found: warn
          retention-days: 30
