
name: Descarga historica inicial 6+1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar yfinance
        run: pip install yfinance

      - name: Descargar historico
        run: python historico_inicial.py

      - name: Conservar historico en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico_inicial/
          if ! git diff --cached --quiet; then
            git commit -m "Guardar historico bursatil desde 2016"
            git push
          fi

      - name: Guardar archivos generados
        uses: actions/upload-artifact@v4
        with:
          name: historico-inicial-6plus1
          path: historico_inicial/
          if-no-files-found: warn
          retention-days: 30
          
