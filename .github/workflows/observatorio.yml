
name: Observatorio 6+1

on:
  workflow_dispatch:
  schedule:
    - cron: "37 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: observatorio-6plus1
  cancel-in-progress: false

jobs:
  recopilar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install yfinance

      - name: Ejecutar observatorio
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail
          python collector.py
          python guardar_historico.py
          python radar.py
          python backtest_6plus1.py
          python validacion_6plus1.py

      - name: Conservar historico
        run: |
          set -euo pipefail
          test -d historico
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico/
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar historico financiero"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-6plus1
          path: |
            output/
            historico/
          if-no-files-found: warn
          retention-days: 30
