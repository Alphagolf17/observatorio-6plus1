
name: Observatorio 6+1

on:
  workflow_dispatch:
  schedule:
    - cron: "37 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: observatorio-6plus1
  cancel-in-progress: false

jobs:
  recopilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.50,<2" "pandas<3"

      - name: Ejecutar observatorio completo
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail
          python collector.py
          python guardar_historico.py
          python radar.py
          python registro_senales.py
          python radar_multiactivo.py
          python analisis_rotacion.py
          python backtest_6plus1.py
          python validacion_6plus1.py

      - name: Conservar historicos y senales
        if: success()
        run: |
          set -euo pipefail

          test -d historico
          test -d historico_multiactivo
          test -d registro_senales

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/observatorio_validado_6plus1
          cp -a historico /tmp/observatorio_validado_6plus1/
          cp -a historico_multiactivo /tmp/observatorio_validado_6plus1/
          cp -a registro_senales /tmp/observatorio_validado_6plus1/

          git fetch origin main
          git reset --hard origin/main

          cp -a /tmp/observatorio_validado_6plus1/historico/. historico/
          cp -a /tmp/observatorio_validado_6plus1/historico_multiactivo/. historico_multiactivo/
          cp -a /tmp/observatorio_validado_6plus1/registro_senales/. registro_senales/

          git add historico/ historico_multiactivo/ registro_senales/

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar historicos, senales y rotacion 6+1"
            git push origin HEAD:main
          else
            echo "Sin cambios en los historicos"
          fi

      - name: Guardar resultados descargables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-6plus1
          path: |
            output/
            historico/
            historico_multiactivo/
            registro_senales/
          if-no-files-found: warn
          retention-days: 30
